name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show && rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets
      - name: Run deterministic regression tests
        run: cargo test --locked
