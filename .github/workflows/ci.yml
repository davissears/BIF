name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show && rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --locked --all-targets
      - name: Validate archived and final Phase E evidence controls
        run: |
          python3 docs/baselines/v2-phase-e/test_rehearse.py
          python3 docs/baselines/v2-phase-e/final-gate/test_gate.py
      # The whole nonignored suite is the manifest's deterministic source of
      # truth: read_release_manifest, read_release_rehearsal, structural query
      # tests and the 100-item benchmark_harness instrumentation are included.
      # Large timing comparisons live in the scheduled/manual read-evidence job.
      - name: Run functional, structural and release-registration tests
        run: cargo test --locked
