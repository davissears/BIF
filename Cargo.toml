[package]
name = "bif"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "bif"
path = "src/main.rs"

[[bin]]
name = "bif-benchmark-store"
path = "src/bin/bif-benchmark-store.rs"

[[bin]]
name = "bif-benchmark"
path = "src/bin/bif-benchmark.rs"

[dependencies]
rusqlite = { version = "0.38.0", features = ["backup", "bundled", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
jsonschema = { version = "0.33.0", default-features = false }
